<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>《余烬守夜》（EmbersKeep）- 美术资产与怪物逐帧动画演播厅</title>
  <link rel="stylesheet" href="src/style.css?v=2.1">
  <style>
    body {
      overflow-y: auto;
      padding: 30px 20px;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 25px;
    }

    .gallery-container {
      width: 1024px;
      background: #100d16;
      border: 2px solid var(--gold-antique);
      border-radius: 8px;
      box-shadow: 0 0 50px rgba(0, 0, 0, 0.95);
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 24px;
      position: relative;
    }

    .gallery-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--iron-rim);
      padding-bottom: 16px;
    }

    .gallery-title h1 {
      font-family: var(--font-serif);
      font-size: 22px;
      color: var(--gold-primary);
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .gallery-title p {
      font-size: 12px;
      color: #8c8299;
      margin-top: 4px;
    }

    .section-title {
      font-family: var(--font-serif);
      font-size: 16px;
      color: var(--gold-highlight);
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 14px;
    }

    /* 怪物动画播放器 */
    .anim-studio {
      display: flex;
      gap: 20px;
      background: #16121f;
      border: 1px solid var(--iron-rim);
      border-radius: 6px;
      padding: 20px;
    }

    .anim-viewport-box {
      width: 280px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
    }

    .anim-canvas-wrap {
      width: 240px;
      height: 240px;
      background: radial-gradient(circle at center, #261f33 0%, #0d0a12 85%);
      border: 2px solid var(--gold-antique);
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: inset 0 0 20px rgba(0,0,0,0.8);
      position: relative;
    }

    canvas#anim-stage {
      image-rendering: pixelated;
      image-rendering: crisp-edges;
    }

    .anim-controls {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .tab-row {
      display: flex;
      gap: 8px;
    }

    .tab-btn {
      background: #201a2b;
      border: 1px solid var(--iron-rim);
      color: #ede8dc;
      padding: 6px 14px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 12px;
      font-weight: bold;
      transition: all 0.15s;
    }

    .tab-btn:hover {
      border-color: var(--gold-antique);
      color: var(--gold-primary);
    }

    .tab-btn.active {
      background: linear-gradient(180deg, #d94126 0%, #8e2311 100%);
      border-color: var(--ember-flame);
      color: #fff;
    }

    .playback-controls {
      display: flex;
      align-items: center;
      gap: 12px;
      background: #110d17;
      padding: 10px 14px;
      border-radius: 4px;
      border: 1px solid var(--iron-rim);
    }

    .ctrl-slider-group {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 11px;
      color: #8c8299;
    }

    .spritesheet-strip-box {
      margin-top: 8px;
    }

    .strip-img-wrap {
      background: #0b0810;
      border: 1px solid var(--iron-rim);
      border-radius: 4px;
      padding: 8px;
      overflow-x: auto;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .strip-img-wrap img {
      image-rendering: pixelated;
      image-rendering: crisp-edges;
    }

    /* 12 张核心防御卡牌网格 */
    .towers-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 14px;
    }

    .tower-card {
      background: #171320;
      border: 1px solid var(--iron-rim);
      border-radius: 6px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      transition: all 0.2s;
      position: relative;
    }

    .tower-card:hover {
      border-color: var(--gold-primary);
      transform: translateY(-4px);
      box-shadow: 0 8px 20px rgba(0,0,0,0.8), 0 0 12px rgba(242, 137, 41, 0.3);
    }

    .tower-card img {
      width: 64px;
      height: 64px;
      image-rendering: pixelated;
      background: #0f0c15;
      border-radius: 6px;
      border: 1px solid var(--iron-rim);
      padding: 4px;
    }

    .tower-card-title {
      font-family: var(--font-serif);
      font-size: 14px;
      font-weight: bold;
      color: #fff;
    }

    .tower-card-badge {
      font-size: 9px;
      padding: 2px 8px;
      border-radius: 10px;
      background: rgba(242, 137, 41, 0.2);
      color: var(--gold-primary);
    }

    .tower-card-stats {
      font-family: var(--font-mono);
      font-size: 11px;
      color: #5eead4;
      display: flex;
      gap: 8px;
    }

    .tower-card-desc {
      font-size: 11px;
      color: #8c8299;
      line-height: 1.4;
      text-align: center;
    }
  </style>
</head>
<body>

  <div class="gallery-container">
    <div class="gallery-header">
      <div class="gallery-title">
        <h1>🎨 《余烬守夜》美术资产与逐帧动画演播厅</h1>
        <p>16-bit 像素工业化管线 · 第一章全量怪物逐帧动作（29帧） · 12张核心防御设施卡牌全景展厅</p>
      </div>
      <div style="display: flex; gap: 10px;">
        <a href="pixelforge/index.html" class="cmd-btn" style="text-decoration: none;">
          <span class="btn-text">⚡ 像素工坊</span>
        </a>
        <a href="index.html" class="cmd-btn primary" style="text-decoration: none;">
          <span class="btn-text">⚔️ 返回战斗战场</span>
        </a>
      </div>
    </div>

    <!-- 1. 怪物逐帧动作播放器 -->
    <div>
      <div class="section-title">👾 第一章怪物全套动作逐帧演播器 (Monster Animation Studio)</div>
      <div class="anim-studio">
        <!-- 左侧视口 -->
        <div class="anim-viewport-box">
          <div class="anim-canvas-wrap">
            <canvas id="anim-stage" width="192" height="192"></canvas>
          </div>
          <div style="font-family: var(--font-mono); font-size: 12px; color: var(--gold-primary);" id="anim-status-text">
            灰烬狼 · 行走 (Frame 1 / 4)
          </div>
        </div>

        <!-- 右侧控制器 -->
        <div class="anim-controls">
          <div>
            <div style="font-size: 11px; color: #8c8299; margin-bottom: 6px;">选择怪物类型：</div>
            <div class="tab-row" id="mob-tabs">
              <button class="tab-btn active" onclick="switchMob('ashen_wolf')">🐺 灰烬狼 (32px)</button>
              <button class="tab-btn" onclick="switchMob('crawler')">🕷️ 灰潮爬行者 (32px)</button>
              <button class="tab-btn" onclick="switchMob('boss_wolf')">👑 狼首领·残烬之影 (48px)</button>
            </div>
          </div>

          <div>
            <div style="font-size: 11px; color: #8c8299; margin-bottom: 6px;">选择动作序列：</div>
            <div class="tab-row" id="action-tabs">
              <button class="tab-btn active" onclick="switchAction('walk')">🚶 行走 (Walk)</button>
              <button class="tab-btn" onclick="switchAction('attack')">⚔️ 攻击扑击 (Attack)</button>
              <button class="tab-btn" onclick="switchAction('death')">💀 破损消融 (Death)</button>
            </div>
          </div>

          <!-- 播放控制台 -->
          <div class="playback-controls">
            <button class="cmd-btn icon-only" id="btn-toggle-play" onclick="togglePlay()">⏸ 暂停</button>
            <button class="cmd-btn icon-only" onclick="prevFrame()">⏮ 上一帧</button>
            <button class="cmd-btn icon-only" onclick="nextFrame()">⏭ 下一帧</button>
            
            <div class="ctrl-slider-group">
              <span>帧率 (FPS):</span>
              <input type="range" id="fps-slider" min="1" max="18" value="6" oninput="updateFPS(this.value)">
              <span id="fps-val" style="color:#fff; font-family:var(--font-mono); width: 24px;">6</span>
            </div>

            <div class="ctrl-slider-group" style="margin-left: auto;">
              <span>放大倍率:</span>
              <select onchange="updateScale(this.value)" style="background:#1e1828; color:#fff; border:1px solid var(--iron-rim); border-radius:3px; padding:2px 6px;">
                <option value="4" selected>4x 像素增强</option>
                <option value="6">6x 细节特写</option>
                <option value="2">2x 原生大小</option>
              </select>
            </div>
          </div>

          <!-- 精灵图册水平序列带展示 -->
          <div class="spritesheet-strip-box">
            <div style="font-size: 11px; color: #8c8299; margin-bottom: 4px;">完整 Spritesheet 序列切片 (2x HD):</div>
            <div class="strip-img-wrap">
              <img id="strip-preview" src="" alt="spritesheet" />
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- 2. 12 张核心防御设施卡牌全览 -->
    <div>
      <div class="section-title">🏰 12 张核心防御设施与战备卡牌图鉴 (Full Card Deck Roster)</div>
      <div class="towers-grid" id="towers-container"></div>
    </div>
  </div>

  <script>
    // 动画配置数据
    let animConfig = null;
    let currentMob = 'ashen_wolf';
    let currentAction = 'walk';
    let currentFrame = 0;
    let isPlaying = true;
    let currentFPS = 6;
    let scaleMultiplier = 4;
    let animTimer = 0;
    let lastTime = performance.now();

    const canvas = document.getElementById('anim-stage');
    const ctx = canvas.getContext('2d');

    // 缓存加载所有精灵图
    const loadedSheets = {};

    async function init() {
      // 加载动画元数据
      const resp = await fetch('data/animations_config.json');
      animConfig = await resp.json();

      // 预加载全部精灵图
      for (const mob in animConfig) {
        loadedSheets[mob] = {};
        for (const act in animConfig[mob]) {
          const img = new Image();
          img.src = animConfig[mob][act].spritesheet_2x;
          loadedSheets[mob][act] = img;
        }
      }

      // 加载 12 张卡牌图鉴
      const cardsResp = await fetch('data/cards_config.json');
      const cardsData = await cardsResp.json();
      renderCards(cardsData.blueprints);

      updateStripView();
      requestAnimationFrame(loop);
    }

    function switchMob(mob) {
      currentMob = mob;
      currentFrame = 0;
      updateTabs('#mob-tabs', mob);
      updateStripView();
    }

    function switchAction(act) {
      currentAction = act;
      currentFrame = 0;
      updateTabs('#action-tabs', act);
      updateStripView();
    }

    function updateTabs(containerSelector, activeVal) {
      const btns = document.querySelectorAll(`${containerSelector} .tab-btn`);
      btns.forEach(btn => {
        if (btn.getAttribute('onclick').includes(`'${activeVal}'`)) {
          btn.classList.add('active');
        } else {
          btn.classList.remove('active');
        }
      });
    }

    function updateStripView() {
      if (!animConfig) return;
      const data = animConfig[currentMob][currentAction];
      const stripImg = document.getElementById('strip-preview');
      stripImg.src = data.spritesheet_2x;
    }

    function togglePlay() {
      isPlaying = !isPlaying;
      document.getElementById('btn-toggle-play').innerText = isPlaying ? '⏸ 暂停' : '▶ 播放';
    }

    function prevFrame() {
      isPlaying = false;
      document.getElementById('btn-toggle-play').innerText = '▶ 播放';
      const maxF = animConfig[currentMob][currentAction].frames_count;
      currentFrame = (currentFrame - 1 + maxF) % maxF;
    }

    function nextFrame() {
      isPlaying = false;
      document.getElementById('btn-toggle-play').innerText = '▶ 播放';
      const maxF = animConfig[currentMob][currentAction].frames_count;
      currentFrame = (currentFrame + 1) % maxF;
    }

    function updateFPS(val) {
      currentFPS = parseInt(val);
      document.getElementById('fps-val').innerText = val;
    }

    function updateScale(val) {
      scaleMultiplier = parseInt(val);
    }

    function loop(time) {
      const dt = (time - lastTime) / 1000;
      lastTime = time;

      if (isPlaying && animConfig) {
        animTimer += dt;
        const interval = 1 / currentFPS;
        if (animTimer >= interval) {
          animTimer = 0;
          const maxF = animConfig[currentMob][currentAction].frames_count;
          currentFrame = (currentFrame + 1) % maxF;
        }
      }

      draw();
      requestAnimationFrame(loop);
    }

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      if (!animConfig) return;

      const meta = animConfig[currentMob][currentAction];
      const sheet = loadedSheets[currentMob]?.[currentAction];
      if (!sheet || !sheet.complete) return;

      // 源帧尺寸 (2x 源图)
      const srcW = meta.frame_width * 2;
      const srcH = meta.frame_height * 2;
      const sx = currentFrame * srcW;
      const sy = 0;

      // 目标绘制尺寸
      const dstW = meta.frame_width * scaleMultiplier;
      const dstH = meta.frame_height * scaleMultiplier;
      const dx = (canvas.width - dstW) / 2;
      const dy = (canvas.height - dstH) / 2;

      ctx.imageSmoothingEnabled = false;
      ctx.drawImage(sheet, sx, sy, srcW, srcH, dx, dy, dstW, dstH);

      // 更新状态文字
      const mobNames = { ashen_wolf: '灰烬狼', crawler: '灰潮爬行者', boss_wolf: '灰狼首领·残烬之影' };
      const actNames = { walk: '行走', attack: '攻击扑击', death: '破坏消融' };
      document.getElementById('anim-status-text').innerText = 
        `${mobNames[currentMob]} · ${actNames[currentAction]} (第 ${currentFrame + 1} / ${meta.frames_count} 帧)`;
    }

    function renderCards(cards) {
      const container = document.getElementById('towers-container');
      container.innerHTML = '';
      cards.forEach(c => {
        const div = document.createElement('div');
        div.className = 'tower-card';
        div.innerHTML = `
          <img src="${c.texture_2x}" />
          <div class="tower-card-title">${c.name}</div>
          <span class="tower-card-badge">#${c.category.toUpperCase()} · ${c.damage_type.toUpperCase()}</span>
          <div class="tower-card-stats">
            ${c.base_damage ? `⚔️ ${c.base_damage}` : (c.max_hp ? `🛡️ ${c.max_hp}` : '')}
            ${c.attack_range ? `🎯 ${c.attack_range}px` : ''}
          </div>
          <div class="tower-card-desc">${c.description}</div>
        `;
        container.appendChild(div);
      });
    }

    window.onload = init;
  </script>
</body>
</html>
